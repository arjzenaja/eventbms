<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Notifications - Dolan Banyumas</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin: 20px 0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            margin: 8px;
            font-size: 14px;
        }
        .btn:hover {
            background: #2563eb;
        }
        .btn-danger {
            background: #ef4444;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .btn-success {
            background: #10b981;
        }
        .btn-success:hover {
            background: #059669;
        }
        .log {
            background: #1f2937;
            color: #f9fafb;
            padding: 16px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            margin: 16px 0;
        }
        .status {
            padding: 12px;
            border-radius: 8px;
            margin: 16px 0;
        }
        .status.healthy {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
        .status.unhealthy {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>
    <h1>🔧 Debug Notifications - Dolan Banyumas</h1>
    
    <div class="card">
        <h2>📊 Status Check</h2>
        <div id="status" class="status">Checking...</div>
        <button class="btn" onclick="checkStatus()">🔄 Refresh Status</button>
    </div>

    <div class="card">
        <h2>🧹 Cleanup Actions</h2>
        <button class="btn btn-danger" onclick="clearAllToasts()">🗑️ Clear All Toast Data</button>
        <button class="btn btn-success" onclick="forceCleanup()">🧽 Force Cleanup</button>
        <button class="btn" onclick="logState()">📋 Log Current State</button>
    </div>

    <div class="card">
        <h2>📝 Console Log</h2>
        <div id="console" class="log">Console output will appear here...</div>
        <button class="btn" onclick="clearConsole()">🧹 Clear Console</button>
    </div>

    <div class="card">
        <h2>🧪 Test Notifications</h2>
        <button class="btn" onclick="testToast('success', 'Test Success', 'This is a test success message')">✅ Test Success</button>
        <button class="btn" onclick="testToast('error', 'Test Error', 'This is a test error message')">❌ Test Error</button>
        <button class="btn" onclick="testToast('warning', 'Test Warning', 'This is a test warning message')">⚠️ Test Warning</button>
        <button class="btn" onclick="testToast('info', 'Test Info', 'This is a test info message')">ℹ️ Test Info</button>
    </div>

    <script>
        // Override console.log to capture output
        const originalLog = console.log;
        const originalWarn = console.warn;
        const originalError = console.error;
        
        function addToConsole(type, ...args) {
            const consoleDiv = document.getElementById('console');
            const timestamp = new Date().toLocaleTimeString();
            const message = args.map(arg => 
                typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
            ).join(' ');
            
            const logEntry = document.createElement('div');
            logEntry.style.marginBottom = '8px';
            logEntry.style.padding = '4px';
            logEntry.style.borderRadius = '4px';
            
            switch(type) {
                case 'warn':
                    logEntry.style.background = '#fef3c7';
                    logEntry.style.color = '#92400e';
                    break;
                case 'error':
                    logEntry.style.background = '#fee2e2';
                    logEntry.style.color = '#991b1b';
                    break;
                default:
                    logEntry.style.background = '#dbeafe';
                    logEntry.style.color = '#1e40af';
            }
            
            logEntry.textContent = `[${timestamp}] ${type.toUpperCase()}: ${message}`;
            consoleDiv.appendChild(logEntry);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }
        
        console.log = (...args) => {
            originalLog.apply(console, args);
            addToConsole('log', ...args);
        };
        
        console.warn = (...args) => {
            originalWarn.apply(console, args);
            addToConsole('warn', ...args);
        };
        
        console.error = (...args) => {
            originalError.apply(console, args);
            addToConsole('error', ...args);
        };

        // Utility functions
        function checkLocalStorageHealth() {
            try {
                const keys = Object.keys(localStorage);
                const issues = [];
                
                keys.forEach(key => {
                    if (key === 'flashToast') {
                        try {
                            const value = localStorage.getItem(key);
                            if (value) {
                                const parsed = JSON.parse(value);
                                if (!parsed || typeof parsed !== 'object') {
                                    issues.push(`Invalid flashToast data type: ${typeof parsed}`);
                                } else if (!['success', 'error', 'warning', 'info'].includes(parsed.type)) {
                                    issues.push(`Invalid flashToast type: ${parsed.type}`);
                                } else if (typeof parsed.title !== 'string' || !parsed.title.trim()) {
                                    issues.push(`Invalid flashToast title: ${parsed.title}`);
                                } else if (typeof parsed.message !== 'string') {
                                    issues.push(`Invalid flashToast message type: ${typeof parsed.message}`);
                                }
                            }
                        } catch (error) {
                            issues.push(`JSON parse error for flashToast: ${error.message}`);
                        }
                    }
                });
                
                return { healthy: issues.length === 0, issues };
            } catch (error) {
                return { healthy: false, issues: [error.message] };
            }
        }

        function checkStatus() {
            const health = checkLocalStorageHealth();
            const statusDiv = document.getElementById('status');
            
            if (health.healthy) {
                statusDiv.className = 'status healthy';
                statusDiv.innerHTML = '✅ localStorage is healthy - no issues found';
            } else {
                statusDiv.className = 'status unhealthy';
                statusDiv.innerHTML = `⚠️ localStorage has ${health.issues.length} issue(s):<br>` + 
                                   health.issues.map(issue => `• ${issue}`).join('<br>');
            }
            
            console.log('Status check completed:', health);
        }

        function clearAllToasts() {
            try {
                localStorage.removeItem('flashToast');
                console.log('All flash toast data cleared');
                checkStatus();
            } catch (error) {
                console.error('Error clearing flash toast data:', error);
            }
        }

        function forceCleanup() {
            try {
                const health = checkLocalStorageHealth();
                if (!health.healthy) {
                    clearAllToasts();
                    console.log('Forced cleanup completed');
                } else {
                    console.log('No cleanup needed - localStorage is healthy');
                }
                checkStatus();
            } catch (error) {
                console.error('Error during forced cleanup:', error);
            }
        }

        function logState() {
            try {
                const keys = Object.keys(localStorage);
                console.log('📋 localStorage contents:');
                
                keys.forEach(key => {
                    if (key === 'flashToast') {
                        try {
                            const value = localStorage.getItem(key);
                            if (value) {
                                const parsed = JSON.parse(value);
                                console.log(`  ${key}:`, parsed);
                            } else {
                                console.log(`  ${key}: null/empty`);
                            }
                        } catch (error) {
                            console.log(`  ${key}: [CORRUPTED] ${error.message}`);
                        }
                    } else {
                        console.log(`  ${key}: [other data]`);
                    }
                });
            } catch (error) {
                console.error('Error logging localStorage state:', error);
            }
        }

        function clearConsole() {
            document.getElementById('console').innerHTML = 'Console output cleared...';
        }

        function testToast(type, title, message) {
            try {
                const testData = { type, title, message };
                localStorage.setItem('flashToast', JSON.stringify(testData));
                console.log('Test toast data set:', testData);
                
                // Simulate page reload to test
                setTimeout(() => {
                    if (confirm('Test data set! Reload page to see notification?')) {
                        window.location.reload();
                    }
                }, 1000);
            } catch (error) {
                console.error('Error setting test toast:', error);
            }
        }

        // Auto-check on load
        window.addEventListener('load', () => {
            console.log('Debug page loaded');
            checkStatus();
        });
    </script>
</body>
</html>
